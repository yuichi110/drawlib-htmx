# PNI Project Configuration Manifest (.pni/pni.toml)
# Precedence: CLI / Workflow step `with:` > Workflow YAML > .pni/pni.toml > Built-in defaults

[project]
name = "htmx"
version = "4.0.1"
archetypes = ["library", "cli"]
language_version = ">=20.0.0"

[targets]
root = "."
source = [
    "src/htmx.js",
    "src/ext",
    "src/scripts",
]
tests = [
    "test/tests",
]
docs = ["README.md"]
exclude = [
    "reports/**",
    "reports_src/**",
    "docs/**",
    "docs_src/**",
    "api_src/**",
    "architecture_src/**",
    "dist/**",
    "dev/**",
    "editors/**",
    "scripts/**",
    "test/manual/**",
    "test/scratch/**",
    "test/lib/**",
    "test/benchmarks/**",
]

[scan]
respect_gitignore = true
include_gitignored = ["package-lock.json"]
skip_files = [".env", ".env.*", "**/.env"]
skip_dirs = [
    "reports",
    "reports_src",
    "docs",
    "docs_src",
    "api_src",
    "architecture_src",
    "dist",
    "dev",
    "editors",
]

[report]
src_dir = "reports_src"
output_dir = "docs/reports/pni501"
html_output_dir = "docs/reports/pni501"
formats = ["pdf", "html"]
lang = "en"
style = "google"

# Declarative design waivers for framework-specific and harness patterns:
[[opt_out]]
id = "DS-0026"
scope = [".pni/dockerfiles/**"]
reason = "Hermetic batch test container exits upon @web/test-runner completion; daemon HEALTHCHECK is not applicable."
